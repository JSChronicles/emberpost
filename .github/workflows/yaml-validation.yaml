name: Validate YAML Schema

on:
  push:
    branches:
    - main

  pull_request:
    branches:
    - main

  workflow_dispatch:

jobs:
  validate-yaml:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --all-groups

      - name: Validate schedule YAML files against packaged JSON Schema
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          from emberpost.schedule_config import load_schedule

          config_paths = sorted(
              [*Path("schedules").glob("*.yaml"), *Path("examples").glob("*.yaml")]
          )
          for config_path in config_paths:
              load_schedule(config_path)
              print(f"validated {config_path}")
          PY
