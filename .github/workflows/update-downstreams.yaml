name: Update downstream repositories

on:
  workflow_call:
    inputs:
      release_sha:
        description: Commit SHA for the published Emberpost release
        required: true
        type: string
      tag:
        description: Published Emberpost tag, such as v0.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch-setup-emberpost:
    runs-on: ubuntu-latest
    steps:
      - name: Create downstream token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.DOWNSTREAM_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DOWNSTREAM_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: setup-emberpost
          permission-contents: write

      - name: Request setup-emberpost update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          version="${TAG#v}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag '$TAG' is not a stable semantic version"
            exit 1
          fi
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release SHA is not a full commit SHA"
            exit 1
          fi

          jq --null-input \
            --arg sha "$RELEASE_SHA" \
            --arg tag "$TAG" \
            --arg version "$version" \
            '{
              event_type: "emberpost_released",
              client_payload: {
                release_sha: $sha,
                tag: $tag,
                version: $version
              }
            }' > "$RUNNER_TEMP/emberpost-release.json"

          gh api \
            --method POST \
            "repos/${OWNER}/setup-emberpost/dispatches" \
            --input "$RUNNER_TEMP/emberpost-release.json"
