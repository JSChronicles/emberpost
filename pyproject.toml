[build-system]
requires = ["uv_build>=0.12.15,<0.14"]
build-backend = "uv_build"

[project]
name = "emberpost"
version = "0.1.0"
description = "Dispatch PagerDuty on-call schedules to Slack."
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
  { name = "JSChronicles" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "jsonschema>=4.26.0,<4.30.0",
  "pagerduty>=7.0.1",
  "pyyaml>=6.0.3",
  "slack-sdk>=3.44.1",
]

[project.urls]
Homepage = "https://github.com/JSChronicles/emberpost"
Repository = "https://github.com/JSChronicles/emberpost"
Issues = "https://github.com/JSChronicles/emberpost/issues"
Documentation = "https://opsfoundry.dev/emberpost/"

[project.scripts]
emberpost = "emberpost.cli:main"

[dependency-groups]
dev = [
  "pytest-cov>=7.1.0,<8.0.0",
  "pytest>=9.1.1,<10.0.0",
  "prek>=0.4.12,<0.6.0",
  "ruff>=0.16.0,<0.20.0",
  "ty>=0.0.60,<0.20.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
addopts = "-s -v --cov=emberpost --cov-report=term-missing --cov-fail-under=50"
norecursedirs = [".git", "__pycache__", ".venv"]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "tests/*",
]

# Keep release assets empty; update and stage uv.lock without uploading it.
[tool.semantic_release]
allow_zero_version = true
build_command = """
uv lock --upgrade-package emberpost
git add uv.lock
"""
commit_message = "chore(release): v{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
major_on_zero = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
template_dir = ".semantic_release/changelog_templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"


[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["N", "E4", "E7", "E9", "F"]
task-tags = ["TODO", "FIXME", "HACK"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { uv-build = false }
